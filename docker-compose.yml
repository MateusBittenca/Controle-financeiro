services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: controle
      POSTGRES_PASSWORD: controle
      POSTGRES_DB: controle_financeiro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controle -d controle_financeiro"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
